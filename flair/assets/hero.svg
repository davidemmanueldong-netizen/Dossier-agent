<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Fond dégradé doux -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6ea"/>
      <stop offset="100%" stop-color="#fdf6f0"/>
    </linearGradient>
    <linearGradient id="bottle1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cfd6"/>
      <stop offset="100%" stop-color="#c9953a" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bottle2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c5b0"/>
      <stop offset="100%" stop-color="#8aaa8a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bottle3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0dde3"/>
      <stop offset="100%" stop-color="#c9953a" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#2a2420" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Cercle décoratif arrière-plan -->
  <circle cx="560" cy="200" r="160" fill="#c9953a" fill-opacity="0.06"/>
  <circle cx="560" cy="200" r="110" fill="#8aaa8a" fill-opacity="0.05"/>

  <!-- ── Flacon 1 — flacon rectangulaire élégant (gauche) ── -->
  <g filter="url(#shadow)" transform="translate(340, 60)">
    <!-- Corps -->
    <rect x="0" y="60" width="68" height="200" rx="6" fill="url(#bottle1Grad)" stroke="#c9953a" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Reflet -->
    <rect x="10" y="75" width="12" height="160" rx="4" fill="white" fill-opacity="0.25"/>
    <!-- Col -->
    <rect x="18" y="34" width="32" height="28" rx="4" fill="#e8cfd6" stroke="#c9953a" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Bouchon -->
    <rect x="14" y="14" width="40" height="22" rx="5" fill="#2a2420" fill-opacity="0.75"/>
    <!-- Bouchon reflet -->
    <rect x="20" y="18" width="8" height="12" rx="2" fill="white" fill-opacity="0.15"/>
    <!-- Étiquette -->
    <rect x="10" y="115" width="48" height="60" rx="3" fill="white" fill-opacity="0.35"/>
    <!-- Lignes déco étiquette -->
    <line x1="18" y1="130" x2="50" y2="130" stroke="#2a2420" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="18" y1="140" x2="42" y2="140" stroke="#2a2420" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="18" y1="150" x2="46" y2="150" stroke="#2a2420" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- ── Flacon 2 — flacon arrondi classique (centre) ── -->
  <g filter="url(#shadow)" transform="translate(430, 40)">
    <!-- Corps principal arrondi -->
    <path d="M10 80 Q10 55 34 55 Q58 55 58 80 L58 240 Q58 265 34 265 Q10 265 10 240 Z" fill="url(#bottle2Grad)" stroke="#8aaa8a" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Reflet latéral -->
    <path d="M18 85 Q18 65 30 65 L32 65 L32 235 Q20 232 18 215 Z" fill="white" fill-opacity="0.2"/>
    <!-- Épaulements -->
    <ellipse cx="34" cy="80" rx="24" ry="8" fill="#b8cdb8" fill-opacity="0.5"/>
    <!-- Col cylindrique -->
    <rect x="22" y="38" width="24" height="44" rx="5" fill="#c8d8c8" stroke="#8aaa8a" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Bouchon doré -->
    <rect x="18" y="16" width="32" height="24" rx="6" fill="#c9953a" fill-opacity="0.85"/>
    <rect x="24" y="20" width="8" height="14" rx="2" fill="white" fill-opacity="0.2"/>
    <!-- Étiquette ronde -->
    <ellipse cx="34" cy="165" rx="22" ry="28" fill="white" fill-opacity="0.3"/>
  </g>

  <!-- ── Flacon 3 — flacon plat moderne (droite) ── -->
  <g filter="url(#shadow)" transform="translate(530, 80)">
    <!-- Corps aplati -->
    <rect x="0" y="50" width="80" height="190" rx="10" fill="url(#bottle3Grad)" stroke="#e8cfd6" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Bords intérieurs arrondis (effet verre épais) -->
    <rect x="8" y="58" width="64" height="174" rx="7" fill="white" fill-opacity="0.12"/>
    <!-- Reflet -->
    <rect x="14" y="66" width="14" height="150" rx="5" fill="white" fill-opacity="0.22"/>
    <!-- Col -->
    <rect x="26" y="26" width="28" height="26" rx="4" fill="#f0dde3" stroke="#c9953a" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Bouchon carré chic -->
    <rect x="22" y="6" width="36" height="22" rx="4" fill="#2a2420" fill-opacity="0.7"/>
    <rect x="28" y="10" width="10" height="13" rx="2" fill="white" fill-opacity="0.12"/>
    <!-- Étiquette -->
    <rect x="12" y="100" width="56" height="80" rx="4" fill="white" fill-opacity="0.28"/>
    <line x1="22" y1="118" x2="58" y2="118" stroke="#2a2420" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="22" y1="130" x2="50" y2="130" stroke="#2a2420" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="22" y1="140" x2="54" y2="140" stroke="#2a2420" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Éléments décoratifs flottants -->
  <circle cx="310" cy="120" r="4" fill="#c9953a" fill-opacity="0.3"/>
  <circle cx="660" cy="80" r="6" fill="#8aaa8a" fill-opacity="0.25"/>
  <circle cx="700" cy="300" r="4" fill="#c9953a" fill-opacity="0.2"/>
  <circle cx="290" cy="320" r="3" fill="#8aaa8a" fill-opacity="0.2"/>

  <!-- Trait décoratif -->
  <path d="M 260 350 Q 400 340 540 350" stroke="#c9953a" stroke-width="1" stroke-opacity="0.2" fill="none"/>
</svg>
